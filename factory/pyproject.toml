[project]
name = "factory"
version = "0.1.0"
description = "Deterministic factory glue: graders, critical-change classifier, record writer"
requires-python = ">=3.13"
dependencies = ["jsonschema>=4", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
