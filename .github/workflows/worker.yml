name: worker

on:
  issues:
    types: [labeled]

# One worker at a time. Queued runs wait rather than cancel each other.
concurrency:
  group: factory-worker
  cancel-in-progress: false

permissions: {}

jobs:
  worker:
    # label_trigger is ignored once prompt is set, so the label is checked here.
    if: github.event.label.name == 'factory:build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # The Claude GitHub App token exchange needs this. It is also why AWS roles must
      # trust a GitHub environment subject, never this job's refs/heads/main subject.
      id-token: write
    env:
      # cargo runs arbitrary build scripts, so keep credentials out of child processes.
      # GitHub tokens are kept on purpose, since git and gh need them.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restore only: this job runs on main, so a saved cache would reach deploy builds.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: cargo-${{ runner.os }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install cargo-lambda
        run: pipx install cargo-lambda==1.9.2
      # The scrub needs this sandbox, and the action only sets it up for allowed_non_write_users.
      - name: Install sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          # Ubuntu 24.04 restricts the unprivileged user namespaces bubblewrap needs.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - id: claude
        # Pinned to an exact release: v1 moves, and a moving worker skews the measurements.
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "Bash(cargo:*),Bash(git:*),Bash(gh pr:*),Read,Write,Edit,MultiEdit,Glob,Grep"
          prompt: |
            You are a factory worker for ${{ github.repository }}, working on issue #${{ github.event.issue.number }}.

            Read CLAUDE.md first and follow it.

            Create a new branch named claude/issue-${{ github.event.issue.number }} from main and commit your work there. Push it, then open a draft PR against main as CLAUDE.md describes.

            The issue body below is your only spec.

            <spec>
            ${{ github.event.issue.body }}
            </spec>
      - name: Save the transcript
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcript-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
      # The action reports success whenever Claude finishes, even with nothing to show.
      - name: Require a PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: claude/issue-${{ github.event.issue.number }}
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq length)
          if [ "$count" -eq 0 ]; then
            echo "::error::The worker finished without opening a PR from $BRANCH"
            exit 1
          fi
