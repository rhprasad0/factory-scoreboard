# Backstop secrets scan of the whole history on every push, including pushes that bypass
# the factory. Prevention is the host's landing gate (sandbox/host/factory.py, secrets()),
# which runs before anything reaches GitHub; by the time this runs, a hit is already public.
name: gitleaks

on: push

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history
        run: >-
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact
          --config sandbox/host/gitleaks.toml --gitleaks-ignore-path "$RUNNER_TEMP" --ignore-gitleaks-allow .
